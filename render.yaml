services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI (Python)
  # ---------------------------------------------------------------------------
  # Docker pins Python 3.11.9 in the image. Native Render Python defaults to
  # 3.14.3 and the pinned pymongo/motor/bcrypt wheels then fail at import
  # with "Exited with status 3" before uvicorn logs anything.
  - type: web
    name: grimoire-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false            # set in the Render dashboard (MongoDB Atlas SRV string)
      - key: DB_NAME
        value: grimoire
      - key: JWT_SECRET
        generateValue: true    # Render generates a secure random value
      - key: CORS_ORIGINS
        sync: false            # set to your frontend URL, e.g. https://grimoire-web.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend — React (static site, built with CRACO)
  # ---------------------------------------------------------------------------
  - type: web
    name: grimoire-web
    runtime: static
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false            # set to the backend URL, e.g. https://grimoire-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
