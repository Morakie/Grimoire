services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI (Python)
  # ---------------------------------------------------------------------------
  - type: web
    name: grimoire-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false            # set in the Render dashboard (MongoDB Atlas SRV string)
      - key: DB_NAME
        value: grimoire
      - key: JWT_SECRET
        generateValue: true    # Render generates a secure random value
      - key: CORS_ORIGINS
        sync: false            # set to your frontend URL, e.g. https://grimoire-web.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend — React (static site, built with CRACO)
  # ---------------------------------------------------------------------------
  - type: web
    name: grimoire-web
    runtime: static
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false            # set to the backend URL, e.g. https://grimoire-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
