# Render Blueprint for production (branch: main). See docs/DEPLOYMENT.md.
services:
  # Backend: FastAPI in Docker (the image pins Python 3.11.9).
  - type: web
    name: grimoire-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false            # MongoDB Atlas SRV string, set in the dashboard
      - key: DB_NAME
        value: grimoire
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false            # the frontend URL, e.g. https://grimoire-web.onrender.com
      - key: ADMIN_EMAIL
        sync: false            # optional seed account
      - key: ADMIN_PASSWORD
        sync: false

  # Frontend: React static site.
  - type: web
    name: grimoire-web
    runtime: static
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false            # the backend URL, no trailing slash, no /api
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
